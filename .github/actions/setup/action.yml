name: Setup
description: "Install required dependencies"

inputs:
  hugo-version:
    description: "Hugo version"
    required: true
    default: "0.126.3"
  node-version:
    description: "Node version"
    required: true
    default: "20"

runs:
  using: "composite"
  steps:
    - name: Setup Hugo ${{ inputs.hugo-version }}
      run: |
        wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${{ inputs.hugo-version }}/hugo_extended_${{ inputs.hugo-version }}_linux-amd64.deb
        sudo dpkg -i ${{ runner.temp }}/hugo.deb
      shell: bash
    - name: Set up pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
    - name: Set up Node ${{ inputs.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: "pnpm"
    - name: Install dependencies
      run: pnpm install
      shell: bash
    - name: Install Playwright browsers
      run: pnpm playwright install --with-deps
      shell: bash
    - name: Install PostCSS globally
      run: npm install -g postcss-cli
      shell: bash
    - name: Install Lighthouse globally
      run: npm install -g @lhci/cli
      shell: bash
